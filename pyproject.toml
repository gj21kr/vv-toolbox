[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "vv-toolbox"
version = "0.1.0"
description = "Synthetic virtual vessel graphs from femoral access to cerebral targets"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "viser>=1.1,<2", "scipy>=1.15,<2", "scikit-image>=0.25,<1", "trimesh>=5,<6", "rtree==1.4.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
remesh = ["mapbox-earcut==1.0.3"]
solid = ["manifold3d==3.5.4"]

[project.scripts]
vv-toolbox = "vv_toolbox.app:main"
vv-case = "vv_toolbox.case_cli:main"
vv-volume = "vv_toolbox.volume_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
